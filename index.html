<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffdb59"><link rel="manifest" href="./manifest.json?v=19"><link rel="apple-touch-icon" href="./icon-192-v19.png"><title>Calculadora Drogas · Turno 6</title>
<style>
*{box-sizing:border-box}
:root{--gold:#ffca23;--gold-light:#fff1a4;--gold-deep:#ba8000;--black:#15120b;--panel:#fff1ae;--white:#fffdf4}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#241b08;background:radial-gradient(circle at 12% 4%,#fff8c9 0,#ffe676 23%,transparent 52%),radial-gradient(circle at 90% 78%,#ffbb22 0,#ffd950 34%,transparent 68%),linear-gradient(145deg,#fff1a0 0%,#ffd044 54%,#f6b522 100%);min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:14px 14px 38px}
.head{position:relative;text-align:center;border:2px solid #9d6d05;border-radius:24px;padding:22px 10px 16px;margin-bottom:16px;min-height:112px;overflow:visible;isolation:isolate;background:linear-gradient(135deg,#fff4ac 0%,#ffd347 40%,#f2ae17 100%);box-shadow:0 5px 0 #b47a17,0 14px 32px #9c65004d,0 0 22px #fff8c0 inset}
.head h1{position:relative;z-index:2;margin:23px 0 0 100px;font-size:clamp(16px,4.5vw,24px);white-space:nowrap;line-height:1;font-weight:950;letter-spacing:.3px;color:#18140c;text-shadow:0 1px 0 #fff3a5,0 0 12px #fff6d0}
.corner{position:absolute;top:10px;padding:7px 9px;border:1px solid #5f4405;border-radius:10px;background:linear-gradient(145deg,#29220d,#090909);box-shadow:0 0 12px #ffd24944 inset;font-size:10px;line-height:1.15;font-weight:950;color:#ffdf5a;text-transform:uppercase}
.corner.right{right:10px;text-align:center;min-width:72px;z-index:3}
.card{background:linear-gradient(160deg,#fff8d0 0%,#ffe78a 50%,#ffcf48 100%);border:2px solid #bb850b;border-radius:22px;padding:18px;box-shadow:0 14px 35px #9e660044,0 0 25px #ffffff80 inset}
.field{margin-bottom:15px}label{display:block;font-weight:900;margin-bottom:7px;color:#28200f}
select,input{width:100%;font-size:17px;padding:14px;border:2px solid #c18a15;border-radius:13px;background:#fffdf1;color:#1d1b14;outline:none;box-shadow:inset 0 2px 7px #bb8a1325}
select:focus,input:focus{border-color:#5c470d;box-shadow:0 0 0 3px #e3ad3266}
.drugframe{display:flex;justify-content:center;margin:14px 0 18px}
.drugpic{display:block;width:205px;height:128px;object-fit:cover;object-position:center;border-radius:13px;border:3px solid #d49b14;background:transparent;box-shadow:0 0 0 2px #fff9d0,0 5px 17px #8b610055;padding:0}
button{width:100%;border:2px solid #594000;border-radius:14px;background:linear-gradient(100deg,#ffbb16,#ffe573 53%,#ffc122);color:#17130b;font-size:18px;font-weight:950;padding:15px;cursor:pointer;box-shadow:0 4px 0 #ad7500,0 7px 18px #a870004a}
button:active{filter:brightness(.93);transform:translateY(2px)}
.result{margin-top:17px;border-radius:18px;padding:12px;background:linear-gradient(145deg,#fff6c1,#ffe27a);border:2px solid #bc8917;display:none;text-align:center;color:#1c180e}
.result img{width:100%;max-height:360px;object-fit:contain;border-radius:14px;margin-bottom:10px;background:#fff7d7}
.result h2{font-size:19px;margin:0 0 7px}.result p{margin:0;color:#30230b}
.result.warn{border-color:#a94825}.result.warn h2{color:#892d12}
.result.good{border-color:#8c6908}.result.good h2{color:#3f350e}
.ref{text-align:center;font-size:13px;color:#695015;margin:13px 0 0}.install{margin-top:12px;display:none}
.head .header-patch{position:absolute;left:-12px;top:-19px;width:134px;height:158px;object-fit:contain;transform:rotate(-10deg);transform-origin:center;z-index:1;filter:drop-shadow(0 4px 7px #0008)}
@media(max-width:380px){.head .header-patch{width:115px;height:138px;left:-10px;top:-14px}.head h1{margin-left:88px;font-size:clamp(15px,4.1vw,21px)}}
/* v15: destacado TURNO 6, sin cambiar el resto de la cabecera */
.corner.right{top:8px;right:9px;min-width:91px;padding:9px 10px;font-family:Impact,"Arial Black",system-ui,sans-serif;font-size:17px;font-weight:1000;letter-spacing:1.15px;line-height:1.05;color:#ffe063;text-shadow:0 1px 0 #5c3e00,0 0 8px #ffc52c88;border:2px solid #c99a24;border-radius:12px;transform:rotate(2deg);box-shadow:0 3px 0 #a06b0b,0 0 14px #ffd24944 inset}
@media(max-width:380px){.corner.right{font-size:15px;min-width:78px;padding:8px 7px;right:7px}}

/* v16: dos títulos de mayor presencia; escudo original sin modificar */
.head{min-height:185px;padding:15px 10px 19px}
.head .header-patch{left:-12px;top:-19px;width:134px;height:158px}
.head .corner.right{top:13px;right:17px;min-width:168px;padding:14px 14px;font-family:Impact,"Arial Black",system-ui,sans-serif;font-size:30px;letter-spacing:1.4px;line-height:1.1;border:3px solid #f5c532;border-radius:15px;background:linear-gradient(160deg,#302306,#050505);color:#ffe55a;text-shadow:1px 2px 0 #745000,0 0 12px #fbd32c88;transform:rotate(2deg)}
.head h1{position:relative;margin:119px 0 0 4px;font-family:Impact,"Arial Black",system-ui,sans-serif;font-size:clamp(23px,6.6vw,34px);font-weight:1000;letter-spacing:.6px;white-space:nowrap;line-height:1.12;color:#211700;text-shadow:1px 2px 0 #fff4b1,2px 3px 0 #c68a0c,0 0 13px #fff6cc}
@media(max-width:380px){.head{min-height:178px}.head .corner.right{top:11px;right:9px;min-width:140px;font-size:25px;padding:12px 9px}.head h1{margin:119px 0 0 0;font-size:clamp(21px,6.1vw,25px)}}
</style></head>
<body><main class="wrap"><section class="head"><img class="header-patch" src="./assets/parche-dunas.png" alt="Parche DUNAS GAC Maspalomas"><div class="corner right">TURNO 6</div><h1>CALCULADORA DROGAS</h1></section><section class="card"><div class="field"><label for="drug">Sustancia</label><select id="drug">
<option value="3|g|heroina">Heroína</option><option value="7.5|g|cocaina">Cocaína</option><option value="100|g|marihuana">Marihuana</option><option value="25|g|hachis">Hachís</option><option value="2.4|g|mdma">MDMA (éxtasis)</option><option value="0.3|g|metanfetamina">Metanfetamina</option><option value="0.003|g|lsd">LSD</option><option value="12.5|ml|ghb">GHB / GBL</option><option value="2.4|g|mefedrona">Mefedrona (4-MMC)</option><option value="2.6|g|tusi">Tusi / cocaína rosa</option></select></div><div class="drugframe"><img id="drugpic" class="drugpic" alt=""></div><div class="field"><label for="amount">Cantidad</label><input id="amount" type="number" min="0" step="any" inputmode="decimal"></div><button id="calc">CALCULAR</button><button id="install" class="install">INSTALAR APP</button><div id="result" class="result"><img id="resultpic" alt=""><h2 id="status"></h2><p id="detail"></p></div><p class="ref" style="opacity:.55">Calculadora T6 · v19</p></section></main>
<script>const drug=document.querySelector('#drug'),amount=document.querySelector('#amount'),pic=document.querySelector('#drugpic'),result=document.querySelector('#result'),resultpic=document.querySelector('#resultpic'),status=document.querySelector('#status'),detail=document.querySelector('#detail');function data(){const[limit,unit,key]=drug.value.split('|');return{limit:+limit,unit,key,name:drug.options[drug.selectedIndex].text}}function update(){const d=data();pic.src=`./assets/${d.key}.jpg?v=16`;pic.alt=`Imagen orientativa: ${d.name}`;amount.placeholder=`Cantidad en ${d.unit}`;result.style.display='none'}function calc(){const d=data(),v=Number(amount.value);result.style.display='block';if(!Number.isFinite(v)||v<=0){result.className='result warn';resultpic.src='./assets/boletin.png';status.textContent='Cantidad no válida';detail.textContent='Introduce una cantidad mayor que cero.';return}if(v<=d.limit){result.className='result good';resultpic.src='./assets/boletin.png';resultpic.alt='Boletín sancionador';status.textContent='POSIBLE SANCIÓN ADMINISTRATIVA';detail.textContent=`${v} ${d.unit} · referencia: ${d.limit} ${d.unit}`}else{result.className='result warn';resultpic.src='./assets/detencion.png';resultpic.alt='Grilletes';status.textContent='POSIBLE RELEVANCIA PENAL';detail.textContent=`${v} ${d.unit} · supera la referencia de ${d.limit} ${d.unit}`}}drug.addEventListener('change',update);document.querySelector('#calc').addEventListener('click',calc);amount.addEventListener('keydown',e=>{if(e.key==='Enter')calc()});update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});let promptEvent;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.style.display='block'});install.addEventListener('click',async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;install.style.display='none'}});</script></body></html>
