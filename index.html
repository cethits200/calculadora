<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061326"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>Calculadora Drogas · Turno 6</title>
<style>*{box-sizing:border-box}:root{--blue:#0b78ff;--navy:#071426;--text:#eef7ff}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 0%,#168dff 0,#0752b8 18%,#071a39 42%,#02060c 76%);min-height:100vh}.wrap{max-width:520px;margin:auto;padding:18px 16px 38px}.head{text-align:center;border:1px solid #168cff;border-radius:24px;padding:18px 14px;margin-bottom:16px;background:linear-gradient(145deg,#149cff,#ffffff18 24%,#0752b8 48%,#071426 72%,#02060c);box-shadow:0 0 28px #087fff55 inset,0 10px 30px #0008}.head h1{margin:0;font-size:28px;text-shadow:0 0 16px #168cff}.head p{margin:5px 0 0;font-weight:800;color:#8fd4ff;letter-spacing:2px}.card{background:linear-gradient(160deg,#0b1c32dd,#050b14ee);border:1px solid #1c75c9;border-radius:22px;padding:18px;box-shadow:0 14px 40px #0009}.field{margin-bottom:15px}label{display:block;font-weight:800;margin-bottom:7px;color:#d9efff}select,input{width:100%;font-size:17px;padding:14px;border:1px solid #236aa8;border-radius:13px;background:#071426;color:#fff;outline:none}.drugpic{display:block;width:210px;height:135px;object-fit:cover;border-radius:16px;margin:2px auto 18px;border:2px solid #29a8ff;box-shadow:0 0 24px #0b8cff66;background:#061326}button{width:100%;border:1px solid #36b9ff;border-radius:14px;background:linear-gradient(100deg,#0649a7,#0b86ff,#032f74);color:#fff;font-size:18px;font-weight:900;padding:15px;cursor:pointer;box-shadow:0 0 20px #087fff55}.result{margin-top:17px;border-radius:17px;padding:14px;background:#071426;border:1px solid #2578be;display:none;text-align:center}.result img{width:100%;max-height:210px;object-fit:contain;border-radius:13px;margin-bottom:10px}.result h2{font-size:19px;margin:0 0 7px}.result p{margin:0;color:#cfe7fa}.result.warn{border-color:#ff5a66}.result.warn h2{color:#ff8790}.result.good h2{color:#77c8ff}.ref{text-align:center;font-size:13px;color:#8eabc4;margin:13px 0 0}.install{margin-top:12px;display:none}</style></head>
<body><main class="wrap"><section class="head"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px"><div style="font-size:12px;font-weight:900;text-align:left;line-height:1.15;color:white">COMISARÍA LOCAL<br>MASPALOMAS</div><div style="font-size:12px;font-weight:900;text-align:right;line-height:1.15;color:white">TURNO 6</div></div><h1>CALCULADORA DROGAS</h1><p>AZUL · BLANCO · TURNO 6</p></section><section class="card"><div class="field"><label for="drug">Sustancia</label><select id="drug">
<option value="3|g|heroina">Heroína</option><option value="7.5|g|cocaina">Cocaína</option><option value="100|g|marihuana">Marihuana</option><option value="25|g|hachis">Hachís</option><option value="2.4|g|mdma">MDMA (éxtasis)</option><option value="2.4|g|mda">MDA</option><option value="2.4|g|mdea">MDEA</option><option value="0.3|g|metanfetamina">Metanfetamina</option><option value="0.003|g|lsd">LSD</option><option value="12.5|ml|ghb">GHB / GBL</option><option value="2.4|g|mefedrona">Mefedrona (4-MMC)</option><option value="2.6|g|tusi">Tusi / cocaína rosa</option></select></div><img id="drugpic" class="drugpic" alt=""><div class="field"><label for="amount">Cantidad</label><input id="amount" type="number" min="0" step="any" inputmode="decimal"></div><button id="calc">CALCULAR</button><button id="install" class="install">INSTALAR APP</button><div id="result" class="result"><img id="resultpic" alt=""><h2 id="status"></h2><p id="detail"></p></div><p id="ref" class="ref"></p><p class="ref" style="opacity:.55">Calculadora T6 · v4</p></section></main>
<script>const drug=document.querySelector('#drug'),amount=document.querySelector('#amount'),pic=document.querySelector('#drugpic'),result=document.querySelector('#result'),resultpic=document.querySelector('#resultpic'),status=document.querySelector('#status'),detail=document.querySelector('#detail'),ref=document.querySelector('#ref');function data(){const[limit,unit,key]=drug.value.split('|');return{limit:+limit,unit,key,name:drug.options[drug.selectedIndex].text}}function update(){const d=data();pic.src=`./assets/${d.key}.jpg`;pic.alt=`Imagen orientativa: ${d.name}`;ref.textContent=`Referencia 5 días: ${d.limit} ${d.unit}`;amount.placeholder=`Cantidad en ${d.unit}`;result.style.display='none'}function calc(){const d=data(),v=Number(amount.value);result.style.display='block';if(!Number.isFinite(v)||v<=0){result.className='result warn';resultpic.src='./assets/boletin.png';status.textContent='Cantidad no válida';detail.textContent='Introduce una cantidad mayor que cero.';return}if(v<=d.limit){result.className='result good';resultpic.src='./assets/boletin.png';resultpic.alt='Boletín sancionador';status.textContent='POSIBLE SANCIÓN ADMINISTRATIVA';detail.textContent=`${v} ${d.unit} · referencia: ${d.limit} ${d.unit}`}else{result.className='result warn';resultpic.src='./assets/detencion.png';resultpic.alt='Grilletes';status.textContent='POSIBLE RELEVANCIA PENAL';detail.textContent=`${v} ${d.unit} · supera la referencia de ${d.limit} ${d.unit}`}}drug.addEventListener('change',update);document.querySelector('#calc').addEventListener('click',calc);amount.addEventListener('keydown',e=>{if(e.key==='Enter')calc()});update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});let promptEvent;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.style.display='block'});install.addEventListener('click',async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;install.style.display='none'}});</script></body></html>
